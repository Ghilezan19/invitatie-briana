<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4e4">
    <title>🎃 Ziua Brianei — Halloween Party</title>
    <meta property="og:title" content="🎃 Ești invitat la ziua Brianei!">
    <meta property="og:description" content="Halloween Party · Sâmbătă, 31 octombrie 2026, ora 14:00">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero { text-align: center; }

        .art {
            position: relative;
            width: 170px;
            height: 150px;
            margin: 0 auto 1.1rem;
        }
        .art .ghost { position: absolute; left: 22px; top: 0; width: 112px; }
        .art .pumpkin { position: absolute; right: 0; bottom: -4px; width: 66px; transform: rotate(8deg); }
        .art .shadow {
            position: absolute; left: 34px; bottom: -8px;
            width: 88px; height: 12px;
            border-radius: 50%;
            background: rgba(36,22,47,0.12);
            animation: shadow 4s ease-in-out infinite;
        }
        @keyframes shadow { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.8); opacity: 0.7; } }

        .title {
            margin-top: 0.5rem;
            font-size: clamp(3.1rem, 15vw, 4.2rem);
            color: var(--purple);
            text-shadow: 3px 3px 0 var(--ink);
        }
        .title .small {
            display: block;
            font-size: 0.5em;
            color: var(--ink);
            text-shadow: none;
            margin-bottom: 0.1em;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1rem;
            padding: 0.35rem 0.95rem;
            border: var(--line);
            border-radius: 999px;
            background: var(--ink);
            color: var(--orange-2);
            font-weight: 600;
            font-size: 0.95rem;
            transform: rotate(-2deg);
        }

        /* Biletul */
        .ticket { margin-top: 1.6rem; overflow: hidden; }
        .ticket-main { display: grid; grid-template-columns: 1fr 1fr; }
        .cell { padding: 1.1rem 0.9rem 1rem; text-align: center; }
        .cell + .cell { border-left: 2px dashed rgba(36,22,47,0.25); }
        .cell small {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-soft);
        }
        .cell b {
            display: block;
            font-size: 2.1rem;
            font-weight: 700;
            line-height: 1.1;
            margin: 0.15rem 0 0.1rem;
            color: var(--orange);
        }
        .cell span { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }

        .ticket-stub {
            position: relative;
            padding: 0.85rem 1rem;
            background: var(--purple-soft);
            border-top: 2.5px dashed var(--ink);
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .ticket-stub::before, .ticket-stub::after {
            content: '';
            position: absolute;
            top: -13px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--paper);
            border: var(--line);
        }
        .ticket-stub::before { left: -13px; }
        .ticket-stub::after { right: -13px; }
        .ticket-stub b { font-weight: 700; }

        .cta { margin-top: 1.6rem; }

        .note {
            margin-top: 0.9rem;
            text-align: center;
            font-size: 0.88rem;
            color: var(--ink-soft);
        }
        .note b { color: var(--ink); font-weight: 600; }

        @media (max-height: 700px) {
            .art { transform: scale(0.8); margin-bottom: -0.8rem; margin-top: -0.8rem; }
            .ticket { margin-top: 1.1rem; }
            .cta { margin-top: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="bunting" aria-hidden="true"></div>
<div class="floaters" aria-hidden="true"></div>

<main class="wrap">
    <section class="hero">
        <div class="art" aria-hidden="true">
            <div class="shadow"></div>
            <svg class="ghost" viewBox="0 0 120 140">
                <path d="M14 62C14 30 34 8 60 8s46 22 46 54v66l-12-10-12 10-11-10-11 10-11-10-11 10-12-10-12 10z"
                      fill="#fffdf9" stroke="#24162f" stroke-width="5" stroke-linejoin="round"/>
                <ellipse cx="45" cy="58" rx="6" ry="8" fill="#24162f"/>
                <ellipse cx="75" cy="58" rx="6" ry="8" fill="#24162f"/>
                <circle cx="47" cy="55" r="2" fill="#fff"/>
                <circle cx="77" cy="55" r="2" fill="#fff"/>
                <circle cx="34" cy="74" r="6" fill="#ffb3c8"/>
                <circle cx="86" cy="74" r="6" fill="#ffb3c8"/>
                <path d="M52 76q8 8 16 0" fill="none" stroke="#24162f" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <svg class="pumpkin" viewBox="0 0 100 92">
                <path d="M50 18c-2-8 1-14 8-16" fill="none" stroke="#24162f" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="30" cy="56" rx="24" ry="30" fill="#ff7a1a" stroke="#24162f" stroke-width="4.5"/>
                <ellipse cx="70" cy="56" rx="24" ry="30" fill="#ff7a1a" stroke="#24162f" stroke-width="4.5"/>
                <ellipse cx="50" cy="56" rx="20" ry="32" fill="#ffa24c" stroke="#24162f" stroke-width="4.5"/>
                <path d="M36 50l6-8 6 8zM52 50l6-8 6 8z" fill="#24162f"/>
                <path d="M36 64q14 12 28 0l-5 2-4-3-5 4-5-4-4 3z" fill="#24162f" stroke="#24162f" stroke-width="2" stroke-linejoin="round"/>
            </svg>
        </div>

        <p class="kicker">Ești invitat la</p>
        <h1 class="title display"><span class="small">ziua</span>Brianei</h1>
        <span class="badge">🎃 Halloween Party</span>
    </section>

    <article class="ticket card">
        <div class="ticket-main">
            <div class="cell">
                <small>Data</small>
                <b>31 Oct</b>
                <span>Sâmbătă, 2026</span>
            </div>
            <div class="cell">
                <small>Ora</small>
                <b>14:00</b>
                <span>după-amiază</span>
            </div>
        </div>
        <div class="ticket-stub">🎭 <b>Dress code:</b> costum de Halloween</div>
    </article>

    <a href="confirma/" class="btn cta">Confirmă prezența <span class="arrow">→</span></a>
    <p class="note">Vă rugăm să confirmați până pe <b>28 octombrie 2026</b></p>
</main>

<script src="deco.js"></script>
</body>
</html>

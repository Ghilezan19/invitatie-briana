<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin — Ziua Brianei</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #07060a; color: #f6f0e6; padding: 2rem 1rem; font-family: 'Manrope', system-ui, sans-serif; }
        .container { max-width: 960px; margin: 0 auto; }
        h1 { margin-bottom: 1.5rem; font-family: 'Cinzel', serif; font-weight: 700; font-size: 2rem; color: #e6b15a; }

        #loginBlock { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 5rem; }
        #loginBlock input { padding: 0.8rem 1rem; font: inherit; border-radius: 12px; border: 1.5px solid rgba(246,240,230,0.2); background: #1e1a1d; color: #f6f0e6; outline: none; }
        #loginBlock input:focus { border-color: #e6b15a; }
        #loginBlock button { padding: 0.8rem 1.3rem; font: inherit; font-weight: 800; border-radius: 12px; border: none; background: #e6b15a; color: #07060a; cursor: pointer; }
        #loginErr { width: 100%; text-align: center; color: #e8641c; display: none; font-family: 'Manrope', sans-serif; font-size: 0.8rem; }

        #adminBlock { display: none; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 1rem; border-top: 1px solid rgba(246,240,230,0.14); border-bottom: 1px solid rgba(246,240,230,0.14); }
        .stat { padding: 0.9rem 0.8rem; }
        .stat + .stat { border-left: 1px solid rgba(246,240,230,0.14); }
        .stat b { display: block; font-size: 2.2rem; font-weight: 800; line-height: 1; }
        .stat:nth-child(1) b { color: #e6b15a; }
        .stat:nth-child(4) b { color: #e8641c; }
        .stat span { font-family: 'Manrope', sans-serif; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(246,240,230,0.55); }
        @media (max-width: 560px) { .stats { grid-template-columns: 1fr 1fr; } .stat:nth-child(3) { border-left: none; } }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.8rem 0.6rem; text-align: left; border-bottom: 1px solid rgba(246,240,230,0.1); vertical-align: middle; }
        th { font-family: 'Manrope', sans-serif; font-size: 0.68rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(246,240,230,0.55); white-space: nowrap; }
        td.num { text-align: center; font-weight: 700; }

        .btn { padding: 0.45rem 0.8rem; border: none; border-radius: 8px; cursor: pointer; font: inherit; font-size: 0.85rem; font-weight: 700; margin: 0.1rem; }
        .btn-edit { background: #2a2528; color: #f6f0e6; }
        .btn-del { background: transparent; color: #e8641c; border: 1px solid rgba(255,91,31,0.4); }
        .btn-save { background: #e6b15a; color: #07060a; }
        .btn-cancel { background: #2a2528; color: #f6f0e6; }

        .edit-mode { padding: 0.4rem; width: 100%; background: #1e1a1d; border: 1.5px solid #e6b15a; color: #f6f0e6; border-radius: 8px; font: inherit; }
        input.edit-mode[type=number] { width: 4rem; }

        #statusMsg { text-align: center; margin-bottom: 1rem; font-family: 'Manrope', sans-serif; font-size: 0.8rem; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎃 Admin Răspunsuri</h1>

    <form id="loginBlock">
        <input type="password" id="passInput" placeholder="Parolă" autofocus>
        <button type="submit">Intră</button>
        <p id="loginErr">Parolă incorectă!</p>
    </form>

    <div id="adminBlock">
        <div class="stats">
            <div class="stat"><b id="sFam">0</b><span>Înscrieri „Vin”</span></div>
            <div class="stat"><b id="sAd">0</b><span>Adulți</span></div>
            <div class="stat"><b id="sKid">0</b><span>Copii</span></div>
            <div class="stat"><b id="sTot">0</b><span>Total persoane</span></div>
        </div>
        <div id="statusMsg"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nr.</th>
                        <th>Nume</th>
                        <th>Răspuns</th>
                        <th>Adulți</th>
                        <th>Copii</th>
                        <th>Mesaj</th>
                        <th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="../db.js"></script>
<script>
    let currentData = [];
    let editingIndex = -1;

    document.getElementById('loginBlock').addEventListener('submit', e => {
        e.preventDefault();
        if (document.getElementById('passInput').value === 'briana') {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('adminBlock').style.display = 'block';
            loadData();
        } else {
            document.getElementById('loginErr').style.display = 'block';
        }
    });

    function status(text, color) {
        const m = document.getElementById('statusMsg');
        m.textContent = text;
        m.style.color = color;
    }

    async function loadData() {
        status('Se încarcă...', '#e6b15a');
        try {
            currentData = (await loadGuests()).data;
            status('', '');
            renderTable();
        } catch (e) {
            console.error(e);
            status('Eroare la încărcare!', '#e8641c');
        }
    }

    function renderStats() {
        const t = totals(currentData);
        document.getElementById('sFam').textContent = t.families;
        document.getElementById('sAd').textContent = t.adults;
        document.getElementById('sKid').textContent = t.kids;
        document.getElementById('sTot').textContent = t.adults + t.kids;
    }

    function renderTable() {
        renderStats();
        const tbody = document.getElementById('tableBody');
        if (!currentData.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Niciun răspuns încă.</td></tr>';
            return;
        }
        tbody.innerHTML = currentData.map((item, i) => {
            if (i === editingIndex) {
                return `<tr>
                    <td>${i + 1}</td>
                    <td><input type="text" id="editName" class="edit-mode" maxlength="60" value="${esc(item.name)}"></td>
                    <td>
                        <select id="editResp" class="edit-mode">
                            <option value="yes" ${item.response === 'yes' ? 'selected' : ''}>Vin!</option>
                            <option value="no" ${item.response !== 'yes' ? 'selected' : ''}>Nu pot</option>
                        </select>
                    </td>
                    <td class="num"><input type="number" min="1" max="15" id="editAdults" class="edit-mode" value="${item.adults || 0}"></td>
                    <td class="num"><input type="number" min="0" max="15" id="editKids" class="edit-mode" value="${item.kids || 0}"></td>
                    <td><input type="text" id="editMsg" class="edit-mode" maxlength="300" value="${esc(item.message || '')}"></td>
                    <td>
                        <button class="btn btn-save" onclick="saveEdit(${i})">Salvează</button>
                        <button class="btn btn-cancel" onclick="cancelEdit()">Anulează</button>
                    </td>
                </tr>`;
            }
            const yes = item.response === 'yes';
            return `<tr>
                <td>${i + 1}</td>
                <td>${esc(item.name)}</td>
                <td>${yes ? 'Vin! 🎉' : 'Nu pot 😢'}</td>
                <td class="num">${yes ? item.adults || 0 : '—'}</td>
                <td class="num">${yes ? item.kids || 0 : '—'}</td>
                <td>${esc(item.message || '')}</td>
                <td>
                    <button class="btn btn-edit" onclick="startEdit(${i})">Editează</button>
                    <button class="btn btn-del" onclick="deleteItem(${i})">Șterge</button>
                </td>
            </tr>`;
        }).join('');
    }

    function startEdit(i) { editingIndex = i; renderTable(); }
    function cancelEdit() { editingIndex = -1; renderTable(); }

    // Identifică intrarea după nume + oră, ca să nu modificăm alt rând
    // dacă între timp s-a mai înscris cineva.
    const sameEntry = (a, b) => a.name === b.name && a.time === b.time;

    async function saveEdit(i) {
        const name = document.getElementById('editName').value.trim().slice(0, MAX_NAME);
        if (!name) return alert('Numele nu poate fi gol!');
        const response = document.getElementById('editResp').value;
        const clamp = v => Math.max(0, Math.min(15, parseInt(v, 10) || 0));
        const patch = {
            name,
            response,
            adults: response === 'yes' ? Math.max(1, clamp(document.getElementById('editAdults').value)) : 0,
            kids: response === 'yes' ? clamp(document.getElementById('editKids').value) : 0,
            message: document.getElementById('editMsg').value.trim().slice(0, MAX_MSG),
        };
        const original = currentData[i];
        editingIndex = -1;
        await save(list => {
            const idx = list.findIndex(g => sameEntry(g, original));
            if (idx >= 0) Object.assign(list[idx], patch);
        }, 'Admin: editare ' + name);
    }

    async function deleteItem(i) {
        const original = currentData[i];
        if (!confirm(`Ștergi răspunsul lui ${original.name}?`)) return;
        await save(list => {
            const idx = list.findIndex(g => sameEntry(g, original));
            if (idx >= 0) list.splice(idx, 1);
        }, 'Admin: ștergere ' + original.name);
    }

    async function save(change, message) {
        status('Se salvează...', '#e6b15a');
        try {
            currentData = await updateGuests(change, message);
            renderTable();
            status('✅ Modificările au fost salvate!', '#e6b15a');
            setTimeout(() => status('', ''), 3000);
        } catch (err) {
            console.error(err);
            status('❌ Eroare la salvare!', '#e8641c');
            loadData();
        }
    }
</script>

</body>
</html>

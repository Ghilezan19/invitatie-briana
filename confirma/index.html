<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4e4">
    <title>🎃 Confirmă prezența — Ziua Brianei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.9rem;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.8rem;
            border: 2px solid var(--ink);
            border-radius: 999px;
            background: var(--white);
            color: var(--ink);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 2px 2px 0 var(--ink);
        }
        .back:hover { background: var(--purple-soft); }
        .top svg { width: 46px; }

        .title {
            font-size: clamp(2.2rem, 10vw, 2.8rem);
            color: var(--purple);
            text-shadow: 2px 2px 0 var(--ink);
            margin-bottom: 1rem;
        }

        .form-card { padding: 1.3rem 1.1rem 1.2rem; }

        .field + .field { margin-top: 1.1rem; }
        .lbl {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .lbl small { font-weight: 400; color: var(--ink-soft); }

        .input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: var(--line);
            border-radius: 14px;
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .input::placeholder { color: rgba(36,22,47,0.35); }
        .input:focus { background: var(--white); box-shadow: 0 0 0 4px rgba(123,63,228,0.2); }
        textarea.input { resize: none; height: 72px; line-height: 1.35; }

        /* Vin / Nu pot */
        .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            padding: 0.7rem 0.4rem 0.6rem;
            border: var(--line);
            border-radius: 16px;
            background: var(--white);
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .choice .e { font-size: 1.7rem; line-height: 1; transition: transform 0.2s; }
        .choice:hover { background: var(--paper); }
        .choice.on { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        .choice.on .e { transform: scale(1.15) rotate(-6deg); }
        .choice[data-r="yes"].on { background: var(--lime); }
        .choice[data-r="no"].on { background: var(--pink); }

        /* Câte persoane */
        .party { display: none; }
        .party.show { display: block; animation: pop-in 0.25s ease; }
        @keyframes pop-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        .counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.6rem 0.6rem 0.6rem 0.8rem;
            border: 2px solid var(--ink);
            border-radius: 16px;
            background: var(--paper);
        }
        .counter + .counter { margin-top: 0.55rem; }
        .who { display: flex; align-items: center; gap: 0.6rem; }
        .who .e {
            display: grid; place-items: center;
            width: 40px; height: 40px;
            border-radius: 12px;
            background: var(--white);
            border: 2px solid var(--ink);
            font-size: 1.35rem;
        }
        .who b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.1; }
        .who small { display: block; font-size: 0.78rem; color: var(--ink-soft); }

        .stepper { display: flex; align-items: center; gap: 0.35rem; }
        .stepper button {
            width: 40px; height: 40px;
            border: 2px solid var(--ink);
            border-radius: 12px;
            background: var(--orange);
            color: var(--ink);
            font-family: inherit;
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--ink);
            touch-action: manipulation;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .stepper button[data-step="-1"] { background: var(--white); }
        .stepper button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
        .stepper button:disabled { opacity: 0.3; cursor: default; }
        .stepper output {
            min-width: 2rem;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .party-sum {
            margin-top: 0.6rem;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            background: var(--purple-soft);
            text-align: center;
            font-size: 0.9rem;
        }
        .party-sum strong { font-weight: 700; color: var(--purple); }

        .send { margin-top: 1.3rem; }

        .err {
            display: none;
            margin-top: 0.7rem;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            background: var(--pink);
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .err.show { display: block; }

        /* Gata */
        .done { display: none; text-align: center; padding: 1.4rem 0.4rem 0.6rem; }
        .done.show { display: block; }
        .done .di { font-size: 3.6rem; animation: pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275); }
        .done h3 { font-size: 2rem; margin: 0.3rem 0 0.4rem; color: var(--purple); }
        .done p { font-size: 1rem; color: var(--ink-soft); margin-bottom: 1.2rem; }
        .done .btn { width: auto; display: inline-flex; padding-inline: 1.3rem; }
        form.off { display: none; }
        @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.15); } 100% { transform: scale(1); } }

        .see { margin-top: 1.1rem; }

        /* Lista */
        .sheet {
            position: fixed; inset: 0;
            z-index: 10;
            display: none;
            align-items: flex-end;
            justify-content: center;
            background: rgba(36,22,47,0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .sheet.show { display: flex; }
        .sheet-body {
            width: 100%;
            max-width: 440px;
            max-height: 82vh;
            overflow-y: auto;
            padding: 1.2rem 1.1rem 1.6rem;
            border: var(--line);
            border-bottom: none;
            border-radius: 24px 24px 0 0;
            background: var(--white);
            animation: up 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
        @media (min-width: 520px) {
            .sheet { align-items: center; padding: 1rem; }
            .sheet-body { border-bottom: var(--line); border-radius: 24px; box-shadow: var(--shadow); }
        }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
        .sheet-head h3 { font-size: 1.7rem; color: var(--purple); }
        .close {
            width: 36px; height: 36px;
            border: 2px solid var(--ink);
            border-radius: 50%;
            background: var(--paper);
            color: var(--ink);
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
        }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .stat {
            padding: 0.55rem 0.3rem;
            border: 2px solid var(--ink);
            border-radius: 14px;
            text-align: center;
        }
        .stat:nth-child(1) { background: var(--purple-soft); }
        .stat:nth-child(2) { background: #ffe0c2; }
        .stat:nth-child(3) { background: #ecf8cf; }
        .stat b { display: block; font-size: 1.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .stat span { font-size: 0.75rem; font-weight: 500; color: var(--ink-soft); }

        .gi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.6rem 0.2rem;
            font-size: 0.98rem;
            font-weight: 500;
        }
        .gi + .gi { border-top: 2px dashed rgba(36,22,47,0.12); }
        .gi .nm { overflow-wrap: anywhere; }
        .gi .nr { color: var(--ink-soft); font-weight: 600; margin-right: 0.35rem; }
        .gb {
            flex-shrink: 0;
            padding: 0.2rem 0.6rem;
            border: 2px solid var(--ink);
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .gb.yes { background: var(--lime); }
        .gb.no { background: var(--pink); }
        .ge { text-align: center; padding: 0.6rem 0; color: var(--ink-soft); }
    </style>
</head>
<body>

<div class="bunting" aria-hidden="true"></div>
<div class="floaters" aria-hidden="true"></div>

<main class="wrap">
    <div class="top">
        <a href="../" class="back">← Invitația</a>
        <svg class="ghost" viewBox="0 0 120 140" aria-hidden="true">
            <path d="M14 62C14 30 34 8 60 8s46 22 46 54v66l-12-10-12 10-11-10-11 10-11-10-11 10-12-10-12 10z"
                  fill="#fffdf9" stroke="#24162f" stroke-width="6" stroke-linejoin="round"/>
            <ellipse cx="45" cy="58" rx="7" ry="9" fill="#24162f"/>
            <ellipse cx="75" cy="58" rx="7" ry="9" fill="#24162f"/>
            <circle cx="34" cy="76" r="7" fill="#ffb3c8"/>
            <circle cx="86" cy="76" r="7" fill="#ffb3c8"/>
        </svg>
    </div>

    <h1 class="title display">Confirmă prezența</h1>

    <div class="card form-card">
        <form id="form">
            <div class="field">
                <label class="lbl" for="name">Numele tău</label>
                <input class="input" type="text" id="name" placeholder="Cum te cheamă?" autocomplete="name" maxlength="60" required>
            </div>

            <div class="field">
                <span class="lbl">Poți veni?</span>
                <div class="choices">
                    <button type="button" class="choice" data-r="yes"><span class="e">🎉</span>Vin!</button>
                    <button type="button" class="choice" data-r="no"><span class="e">😢</span>Nu pot</button>
                </div>
            </div>

            <div class="field party" id="party">
                <span class="lbl">Câte persoane veniți?</span>

                <div class="counter">
                    <div class="who">
                        <span class="e">🧛</span>
                        <div><b>Adulți</b><small>inclusiv tu</small></div>
                    </div>
                    <div class="stepper" data-key="adults" data-min="1" data-max="15">
                        <button type="button" data-step="-1" aria-label="Scade adulți">−</button>
                        <output id="adultsOut">1</output>
                        <button type="button" data-step="1" aria-label="Adaugă adulți">+</button>
                    </div>
                </div>

                <div class="counter">
                    <div class="who">
                        <span class="e">🧒</span>
                        <div><b>Copii</b><small>mici vrăjitori</small></div>
                    </div>
                    <div class="stepper" data-key="kids" data-min="0" data-max="15">
                        <button type="button" data-step="-1" aria-label="Scade copii">−</button>
                        <output id="kidsOut">0</output>
                        <button type="button" data-step="1" aria-label="Adaugă copii">+</button>
                    </div>
                </div>

                <p class="party-sum" id="partySum"></p>
            </div>

            <div class="field">
                <label class="lbl" for="msg">Mesaj <small>(opțional)</small></label>
                <textarea class="input" id="msg" placeholder="Ceva de adăugat?" maxlength="300"></textarea>
            </div>

            <button type="submit" class="btn send" id="sendBtn" disabled>Trimite</button>
            <p class="err" id="err"></p>
        </form>

        <div class="done" id="done">
            <div class="di" id="doneIcon">🎉</div>
            <h3 class="display" id="doneTitle">Mersi!</h3>
            <p id="doneText">Răspunsul tău a fost salvat.</p>
            <a href="../" class="btn btn-ghost">← Înapoi la invitație</a>
        </div>
    </div>

    <button type="button" class="btn btn-ghost see" id="toggleBtn">👀 Vezi cine mai vine</button>
</main>

<div id="guestsOverlay" class="sheet">
    <div class="sheet-body" role="dialog" aria-labelledby="sheetTitle">
        <div class="sheet-head">
            <h3 class="display" id="sheetTitle">Cine vine</h3>
            <button type="button" id="closeModalBtn" class="close" aria-label="Închide">&times;</button>
        </div>
        <div class="stats" id="stats" hidden>
            <div class="stat"><b id="sFam">0</b><span>înscrieri</span></div>
            <div class="stat"><b id="sAd">0</b><span>adulți</span></div>
            <div class="stat"><b id="sKid">0</b><span>copii</span></div>
        </div>
        <div id="gList"><div class="ge">Se încarcă… 🦇</div></div>
    </div>
</div>

<script src="../deco.js"></script>
<script src="../db.js"></script>
<script>
    let pick = null;
    const count = { adults: 1, kids: 0 };
    const nm = document.getElementById('name');
    const sendBtn = document.getElementById('sendBtn');
    const party = document.getElementById('party');

    document.querySelectorAll('.choice').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.choice').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            pick = b.dataset.r;
            party.classList.toggle('show', pick === 'yes');
            chk();
        });
    });

    document.querySelectorAll('.stepper').forEach(st => {
        const key = st.dataset.key;
        const min = +st.dataset.min, max = +st.dataset.max;
        st.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                count[key] = Math.min(max, Math.max(min, count[key] + +btn.dataset.step));
                renderCounts();
            });
        });
    });

    function renderCounts() {
        document.getElementById('adultsOut').textContent = count.adults;
        document.getElementById('kidsOut').textContent = count.kids;
        document.querySelectorAll('.stepper').forEach(st => {
            const v = count[st.dataset.key];
            st.querySelector('[data-step="-1"]').disabled = v <= +st.dataset.min;
            st.querySelector('[data-step="1"]').disabled = v >= +st.dataset.max;
        });
        const total = count.adults + count.kids;
        const name = nm.value.trim() || 'Tu';
        document.getElementById('partySum').innerHTML =
            `<strong>${esc(name)}</strong>: ${partyLabel(count)} → <strong>${plural(total, 'persoană', 'persoane')}</strong> în total`;
    }

    nm.addEventListener('input', () => { renderCounts(); chk(); });

    function chk() { sendBtn.disabled = !(nm.value.trim() && pick); }

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        if (sendBtn.disabled) return;

        const err = document.getElementById('err');
        err.classList.remove('show');
        sendBtn.disabled = true;
        sendBtn.textContent = 'Se trimite...';

        const entry = {
            name: nm.value.trim().slice(0, MAX_NAME),
            response: pick,
            adults: pick === 'yes' ? count.adults : 0,
            kids: pick === 'yes' ? count.kids : 0,
            message: document.getElementById('msg').value.trim().slice(0, MAX_MSG),
            time: new Date().toISOString(),
        };

        try {
            guests = await updateGuests(list => list.push(entry), 'RSVP: ' + entry.name);
        } catch (ex) {
            console.error(ex);
            err.textContent = 'Nu s-a putut trimite. Mai apasă o dată pe Trimite.';
            err.classList.add('show');
            sendBtn.disabled = false;
            sendBtn.textContent = 'Trimite';
            return;
        }

        e.target.classList.add('off');
        document.getElementById('done').classList.add('show');
        const yes = pick === 'yes';
        document.getElementById('doneIcon').textContent = yes ? '🎉' : '😢';
        document.getElementById('doneTitle').textContent = yes ? 'Ne vedem acolo!' : 'Păcat...';
        document.getElementById('doneText').textContent = yes
            ? `Te-am trecut cu ${partyLabel(entry)}. Pregătiți costumele! 🧡`
            : 'Poate altă dată! 🧡';
        renderList();
    });

    // Lista
    let guests = null;

    async function loadData() {
        try {
            guests = (await loadGuests()).data;
        } catch (ex) {
            console.error(ex);
            document.getElementById('gList').innerHTML = '<div class="ge">Lista nu s-a putut încărca 👻</div>';
            return;
        }
        renderList();
    }

    function renderList() {
        const list = document.getElementById('gList');
        if (!guests) return;
        if (!guests.length) {
            document.getElementById('stats').hidden = true;
            list.innerHTML = '<div class="ge">Fii primul care răspunde 🦇</div>';
            return;
        }
        const t = totals(guests);
        document.getElementById('stats').hidden = false;
        document.getElementById('sFam').textContent = t.families;
        document.getElementById('sAd').textContent = t.adults;
        document.getElementById('sKid').textContent = t.kids;

        // Cei care vin primii, apoi cei care nu pot
        const sorted = [...guests.filter(g => g.response === 'yes'), ...guests.filter(g => g.response !== 'yes')];
        list.innerHTML = sorted.map((g, i) => `
            <div class="gi">
                <span class="nm"><span class="nr">${i + 1}.</span>${esc(g.name)}</span>
                <span class="gb ${g.response === 'yes' ? 'yes' : 'no'}">${g.response === 'yes' ? partyLabel(g) : 'nu poate'}</span>
            </div>`).join('');
    }

    const overlay = document.getElementById('guestsOverlay');
    document.getElementById('toggleBtn').addEventListener('click', () => { overlay.classList.add('show'); loadData(); });
    document.getElementById('closeModalBtn').addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('show'); });

    renderCounts();
</script>
</body>
</html>

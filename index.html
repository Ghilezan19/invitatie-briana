<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07060a">
    <title>🎃 Ziua Brianei — Halloween Party</title>
    <meta property="og:title" content="🎃 Ești invitat la ziua Brianei!">
    <meta property="og:description" content="Halloween Party · Sâmbătă, 31 octombrie 2026, ora 14:00">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ---------- Invitația ---------- */
        .top { justify-content: center; color: var(--gold); }

        .hero .orn { width: 100%; }
        .hero {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .pre {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            font-size: clamp(1.2rem, 3dvh, 1.6rem);
            color: var(--muted);
        }
        .name {
            margin: 0.4dvh 0 1.4dvh;
            font-family: var(--display);
            font-weight: 700;
            font-size: min(16vw, 10.5dvh, 6rem);
            line-height: 1;
            letter-spacing: 0.04em;
            filter: drop-shadow(0 0 24px rgba(232, 140, 50, 0.35));
        }
        .tagline {
            margin-top: 1.4dvh;
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(1rem, 2.4dvh, 1.25rem);
            color: var(--muted);
        }

        .cd {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 3.5dvh;
        }
        .cd .u { min-width: 3.6rem; }
        .cd b {
            display: block;
            font-family: var(--display);
            font-weight: 500;
            font-size: min(9vw, 5.4dvh, 2.6rem);
            line-height: 1;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .cd .caps { display: block; margin-top: 0.5rem; color: var(--gold); font-size: 0.56rem; }
        .cd .sep { font-family: var(--display); font-size: min(7vw, 4dvh, 2rem); line-height: 1.1; color: var(--line); }
        .cd-done { font-family: var(--serif); font-style: italic; font-size: 1.5rem; color: var(--gold-2); }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin: 3.5dvh 0 3dvh;
            padding: 2.2dvh 0.4rem;
        }
        .d { text-align: center; padding: 0 0.3rem; }
        .d + .d { border-left: 1px solid var(--faint); }
        .d svg { width: 22px; height: 22px; color: var(--gold); margin-bottom: 0.7dvh; }
        .d .caps { display: block; color: var(--muted); font-size: 0.55rem; margin-bottom: 0.35rem; }
        .d b {
            display: block;
            font-family: var(--serif);
            font-weight: 600;
            font-size: clamp(1.05rem, 2.5dvh, 1.3rem);
            line-height: 1.15;
        }

        .deadline {
            margin-top: 1.4dvh;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            font-size: 1rem;
            color: var(--muted);
        }
        .deadline b { font-style: normal; font-weight: 600; color: var(--gold-2); }

        @media (max-height: 660px) {
            .tagline { display: none; }
            .details { margin: 2.4dvh 0 2dvh; padding: 1.6dvh 0.4rem; }
            .d svg { display: none; }
            .btn { padding: 0.9rem 1.2rem; }
        }
    </style>
</head>
<body>

<main class="screen">
    <div class="bar top caps">
        <div class="orn" style="width:100%">
            <span>Halloween Party</span>
        </div>
    </div>

    <section class="hero">
        <p class="pre">Ești invitat la ziua</p>
        <h1 class="name gold-text">Brianei</h1>
        <div class="orn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6c-.3-1.6.4-3 1.8-3.6"/>
                <path d="M12 6c-4.5 0-8 3-8 7s3.5 7 8 7 8-3 8-7-3.5-7-8-7z"/>
                <path d="M12 6c-2 0-3.5 3-3.5 7s1.5 7 3.5 7 3.5-3 3.5-7-1.5-7-3.5-7z"/>
            </svg>
        </div>
        <p class="tagline">o după-amiază cu costume, dulciuri și puțină magie</p>

        <div class="cd" id="cd" aria-label="Timp rămas până la petrecere">
            <div class="u"><b id="cdD">--</b><span class="caps">zile</span></div>
            <span class="sep">·</span>
            <div class="u"><b id="cdH">--</b><span class="caps">ore</span></div>
            <span class="sep">·</span>
            <div class="u"><b id="cdM">--</b><span class="caps">minute</span></div>
            <span class="sep">·</span>
            <div class="u"><b id="cdS">--</b><span class="caps">secunde</span></div>
        </div>

        <div class="details frame" style="width:100%">
            <i class="c1"></i><i class="c2"></i>
            <div class="d">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
                <span class="caps">Sâmbătă</span>
                <b>31 Octombrie</b>
            </div>
            <div class="d">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
                <span class="caps">Ora</span>
                <b>14:00</b>
            </div>
            <div class="d">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0 0 5-2 9-5 9-2 0-3-1.5-4-3-1 1.5-2 3-4 3-3 0-5-4-5-9z"/><path d="M7 11.5c.8-.6 1.8-.6 2.6 0M14.4 11.5c.8-.6 1.8-.6 2.6 0"/></svg>
                <span class="caps">Dress code</span>
                <b>Costum de Halloween</b>
            </div>
        </div>
    </section>

    <a href="confirma/" class="btn">Confirmă prezența <span class="arr">→</span></a>
    <p class="deadline">Vă rugăm să confirmați până pe <b>28 octombrie 2026</b></p>
</main>

<script src="atmosphere.js"></script>
<script>
    // Numărătoare inversă (ora României, UTC+2 după 25 octombrie)
    const PARTY = new Date('2026-10-31T14:00:00+02:00').getTime();
    const pad = n => String(n).padStart(2, '0');
    function tick() {
        const left = PARTY - Date.now();
        if (left <= 0) {
            document.getElementById('cd').innerHTML = '<p class="cd-done">Petrecerea a început!</p>';
            return;
        }
        const s = Math.floor(left / 1000);
        document.getElementById('cdD').textContent = pad(Math.floor(s / 86400));
        document.getElementById('cdH').textContent = pad(Math.floor(s / 3600) % 24);
        document.getElementById('cdM').textContent = pad(Math.floor(s / 60) % 60);
        document.getElementById('cdS').textContent = pad(s % 60);
        setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07060a">
    <title>🎃 Confirmă prezența — Ziua Brianei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../theme.css">
    <style>
        .screen { justify-content: center; overflow-y: auto; scrollbar-width: none; }
        .screen::-webkit-scrollbar { display: none; }

        .card {
            padding: clamp(1.1rem, 3dvh, 1.8rem) clamp(1rem, 5vw, 1.6rem);
            transition: opacity 0.6s ease;
        }
        body.loading .card { opacity: 0; }
        @keyframes page-in { from { opacity: 0; } }

        .card-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
        .card-top a { color: inherit; text-decoration: none; transition: color 0.2s; }
        .card-top a:hover { color: var(--gold-2); }

        .title {
            margin: clamp(0.6rem, 2dvh, 1.2rem) 0 0.2rem;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            font-size: min(9.5vw, 5.6dvh, 2.6rem);
            line-height: 1.05;
        }
        .title .o {
            font-style: normal;
            font-family: var(--display);
            font-weight: 700;
            font-size: 0.82em;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card .orn { margin-bottom: clamp(0.8rem, 2.4dvh, 1.4rem); }

        .field + .field { margin-top: clamp(0.8rem, 2.2dvh, 1.2rem); }
        .lbl { display: block; margin-bottom: 0.5rem; color: var(--gold); font-size: 0.6rem; }
        .lbl small { color: var(--muted); letter-spacing: 0.2em; }

        .input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--line);
            border-radius: 0;
            background: rgba(7, 6, 10, 0.5);
            color: var(--ink);
            font-family: var(--serif);
            font-size: 1.25rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .input:focus { border-color: var(--gold); background: rgba(7, 6, 10, 0.7); }
        .input::placeholder { color: rgba(243, 233, 216, 0.28); font-style: italic; }
        .input:-webkit-autofill,
        .input:-webkit-autofill:hover,
        .input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--ink);
            caret-color: var(--ink);
            font-family: var(--serif);
            font-size: 1.25rem;
            transition: background-color 99999s ease 0s;
        }
        textarea.input { resize: none; height: clamp(52px, 8dvh, 72px); font-size: 1.1rem; line-height: 1.3; }

        .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .choice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: clamp(0.65rem, 1.8dvh, 0.9rem) 0.5rem;
            border: 1px solid var(--line);
            background: rgba(7, 6, 10, 0.5);
            color: var(--ink);
            font-family: var(--display);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s;
            -webkit-tap-highlight-color: transparent;
        }
        .choice .e { font-size: 1.2rem; }
        .choice:hover { border-color: var(--gold); }
        .choice.on { background: var(--gold-grad); color: #1a1006; border-color: transparent; box-shadow: 0 6px 24px rgba(232, 140, 50, 0.3); }
        .choice[data-r="no"].on { background: linear-gradient(135deg, #5a4a52, #2c2329); color: var(--ink); box-shadow: none; }

        /* Câte persoane */
        .party { display: none; }
        .party.show { display: block; animation: page-in 0.3s ease; }
        .counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(0.45rem, 1.3dvh, 0.7rem) 0;
            border-bottom: 1px solid var(--faint);
        }
        .counter:first-of-type { border-top: 1px solid var(--faint); }
        .who { display: flex; align-items: center; gap: 0.7rem; }
        .who .e { font-size: 1.4rem; }
        .who b { display: block; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1; }
        .who span { display: block; margin-top: 0.25rem; color: var(--muted); font-size: 0.52rem; }
        .stepper { display: flex; align-items: center; gap: 0.6rem; }
        .stepper button {
            width: 40px; height: 40px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: transparent;
            color: var(--gold-2);
            font-family: var(--sans);
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .stepper button:focus { outline: none; }
        .stepper button:focus-visible { box-shadow: 0 0 0 3px rgba(230, 177, 90, 0.45); }
        .stepper button[data-step="-1"]:hover:not(:disabled) { border-color: var(--gold); background: rgba(230, 177, 90, 0.08); }
        .stepper button[data-step="1"] { background: var(--gold-grad); color: #1a1006; border-color: transparent; }
        .stepper button[data-step="1"]:hover:not(:disabled) { filter: brightness(1.08); }
        .stepper button:active:not(:disabled) { transform: scale(0.9); }
        .stepper button:disabled { opacity: 0.25; cursor: default; }
        .stepper output {
            min-width: 1.6ch;
            text-align: center;
            font-family: var(--display);
            font-weight: 500;
            font-size: 1.9rem;
            line-height: 1;
        }
        .sum { margin-top: 0.6rem; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--muted); }
        .sum b { font-style: normal; font-weight: 600; color: var(--gold-2); }

        .add-msg {
            display: block;
            margin: clamp(0.8rem, 2dvh, 1.1rem) auto 0;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .add-msg:hover { color: var(--gold-2); }
        .msg-field { display: none; }
        .msg-field.show { display: block; animation: page-in 0.3s ease; }
        .add-msg.hide { display: none; }

        .send { margin-top: clamp(1rem, 2.8dvh, 1.5rem); }

        /* Telefoane scunde: totul trebuie să încapă fără scroll */
        @media (max-height: 720px) {
            .card { padding: 0.9rem 1rem; }
            .title { font-size: 1.85rem; margin-top: 0.5rem; }
            .card .orn { margin-bottom: 0.7rem; }
            .lbl { margin-bottom: 0.35rem; }
            .input { padding: 0.55rem 0.8rem; font-size: 1.1rem; }
            .choice { padding: 0.55rem 0.4rem; font-size: 0.92rem; }
            .counter { padding: 0.35rem 0; }
            .stepper button { width: 36px; height: 36px; }
            .stepper output { font-size: 1.6rem; }
            .who b { font-size: 1.15rem; }
            .sum { margin-top: 0.4rem; font-size: 0.98rem; }
            .btn { padding: 0.85rem 1.2rem; }
            .foot { margin-top: 0.7rem; padding-top: 0.6rem; }
            .wall-link { padding: 0.45rem 1rem; }
        }
        .err { display: none; margin-top: 0.7rem; color: #ff9a6a; text-align: center; }
        .err.show { display: block; }

        .foot { margin-top: clamp(0.9rem, 2.4dvh, 1.3rem); padding-top: clamp(0.8rem, 2dvh, 1.1rem); border-top: 1px solid var(--faint); text-align: center; }
        .wall-link {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--gold-2);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .wall-link:hover { border-color: var(--gold); background: rgba(230, 177, 90, 0.08); }
        .wall-link b { color: var(--ink); }

        /* Gata */
        form.off { display: none; }
        .done { display: none; text-align: center; padding: 0.4rem 0 0.2rem; }
        .done.show { display: block; }
        .wax { width: min(26vw, 13dvh, 108px); aspect-ratio: 1; margin: 0 auto 1.6dvh; }
        .wax svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6)); }
        .done.show .wax { animation: stamp 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) 0.1s both; }
        @keyframes stamp {
            0% { opacity: 0; transform: scale(2.2) rotate(-18deg); }
            60% { opacity: 1; }
            100% { opacity: 1; transform: scale(1) rotate(-8deg); }
        }
        .done .ok { display: none; }

        /* După confirmare: doar sigiliul, mesajul și două linkuri discrete */
        .card.is-done .title,
        .card.is-done > .orn { display: none; }
        .card.is-done .done { padding: clamp(1rem, 3dvh, 1.8rem) 0 0.4rem; }
        .card.is-done .wax { margin-bottom: 2.4dvh; }
        .card.is-done .foot { border-top: none; margin-top: 1.4rem; padding-top: 0; display: flex; justify-content: center; gap: 1.6rem; }
        .card.is-done .wall-link { padding: 0.4rem 0; border: none; border-radius: 0; color: var(--gold); }
        .card.is-done .wall-link:hover { background: none; color: var(--gold-2); }
        .card.is-done .wall-link b { color: inherit; }
        .done h2 { margin: 0.5rem 0; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: min(10vw, 6dvh, 2.6rem); line-height: 1.05; }
        .done h2 .o { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 0.85em; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .done p.txt { max-width: 30ch; margin: 0 auto; font-family: var(--serif); font-size: 1.15rem; color: var(--muted); line-height: 1.4; }
        .again { padding: 0.4rem 0; background: none; border: none; color: var(--muted); cursor: pointer; transition: color 0.2s; }
        .again:hover { color: var(--gold-2); }
        .again[hidden] { display: none; }

        /* Lista de monștri */
        .wall {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(7, 6, 10, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0s linear 0.3s;
        }
        .wall.show { opacity: 1; visibility: visible; transition: opacity 0.3s; }
        .wall-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 520px;
            max-height: 86dvh;
            padding: 1.3rem 1.2rem 1.1rem;
            background: rgba(14, 10, 16, 0.92);
        }
        .wall-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .wall-head h2 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.9rem; line-height: 1; }
        .wall-head h2 .o { font-family: var(--display); font-style: normal; font-weight: 700; font-size: 0.85em; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .close {
            width: 40px; height: 40px; flex-shrink: 0;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: transparent;
            color: var(--gold-2);
            font-size: 1.3rem;
            cursor: pointer;
        }
        .close:hover { border-color: var(--gold); }

        .totals { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0.8rem 0; border-top: 1px solid var(--faint); border-bottom: 1px solid var(--faint); }
        .totals div { text-align: center; }
        .totals div + div { border-left: 1px solid var(--faint); }
        .totals b { display: block; font-family: var(--display); font-weight: 500; font-size: 2rem; line-height: 1; }
        .totals div:nth-child(1) b { color: var(--gold-2); }
        .totals span { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 0.52rem; }

        .tiles {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            align-content: start;
            gap: 0.5rem;
            padding-top: 0.9rem;
        }
        .tile { position: relative; padding: 0.75rem; border: 1px solid var(--faint); background: rgba(7, 6, 10, 0.5); }
        .tile .nr {
            position: absolute;
            top: 0.65rem; right: 0.75rem;
            font-family: var(--display);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--gold);
        }
        .tile .nr small { font-size: 0.7em; opacity: 0.7; margin-right: 0.1em; }
        .tile .m { font-size: 1.5rem; line-height: 1; }
        .tile .n { margin-top: 0.45rem; font-family: var(--serif); font-weight: 600; font-size: 1.15rem; line-height: 1.1; overflow-wrap: anywhere; }
        .tile .c { margin-top: 0.4rem; color: var(--gold); font-size: 0.5rem; }
        .tile.no { opacity: 0.45; }
        .tile.no .c { color: var(--muted); }
        .empty { grid-column: 1 / -1; padding: 1.5rem 0; text-align: center; color: var(--muted); }
    </style>
</head>
<body class="sub loading">

<main class="screen">
    <div class="card frame">
        <i class="c1"></i><i class="c2"></i>

        <div class="card-top caps">
            <a href="../">← Invitația</a>
            <span>31 · 10 · 2026</span>
        </div>

        <h1 class="title">Confirmă <span class="o">prezența</span></h1>
        <div class="orn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6c-.3-1.6.4-3 1.8-3.6"/>
                <path d="M12 6c-4.5 0-8 3-8 7s3.5 7 8 7 8-3 8-7-3.5-7-8-7z"/>
                <path d="M12 6c-2 0-3.5 3-3.5 7s1.5 7 3.5 7 3.5-3 3.5-7-1.5-7-3.5-7z"/>
            </svg>
        </div>

        <form id="form" autocomplete="off">
            <div class="field">
                <label class="lbl caps" for="name">Numele tău</label>
                <input class="input" type="text" id="name" placeholder="Cum te cheamă?" maxlength="60" autocomplete="off" autocapitalize="words" spellcheck="false">
            </div>

            <div class="field">
                <span class="lbl caps">Poți veni?</span>
                <div class="choices">
                    <button type="button" class="choice" data-r="yes"><span class="e">🎉</span>Vin!</button>
                    <button type="button" class="choice" data-r="no"><span class="e">😢</span>Nu pot</button>
                </div>
            </div>

            <div class="field party" id="party">
                <span class="lbl caps">Câte persoane veniți?</span>
                <div class="counter">
                    <div class="who"><span class="e">🧛</span><div><b>Adulți</b><span class="caps">inclusiv tu</span></div></div>
                    <div class="stepper" data-key="adults" data-min="1" data-max="15">
                        <button type="button" data-step="-1" aria-label="Scade adulți">−</button>
                        <output id="adultsOut">1</output>
                        <button type="button" data-step="1" aria-label="Adaugă adulți">+</button>
                    </div>
                </div>
                <div class="counter">
                    <div class="who"><span class="e">🧒</span><div><b>Copii</b><span class="caps">mici monștri</span></div></div>
                    <div class="stepper" data-key="kids" data-min="0" data-max="15">
                        <button type="button" data-step="-1" aria-label="Scade copii">−</button>
                        <output id="kidsOut">0</output>
                        <button type="button" data-step="1" aria-label="Adaugă copii">+</button>
                    </div>
                </div>
                <p class="sum" id="sum"></p>
            </div>

            <button type="button" class="add-msg caps" id="addMsg">+ Adaugă un mesaj</button>
            <div class="field msg-field" id="msgField">
                <label class="lbl caps" for="msg">Mesaj <small>(opțional)</small></label>
                <textarea class="input" id="msg" placeholder="Ceva de adăugat?" maxlength="300" autocomplete="off"></textarea>
            </div>

            <button type="submit" class="btn send" id="sendBtn" disabled>Trimite <span class="arr">→</span></button>
            <p class="err caps" id="err"></p>
        </form>

        <div class="done" id="done">
            <div class="wax" aria-hidden="true">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="waxG" cx="38%" cy="32%" r="75%">
                            <stop offset="0" stop-color="#ff8a3d"/><stop offset=".45" stop-color="#d6471a"/><stop offset="1" stop-color="#7a1d08"/>
                        </radialGradient>
                        <linearGradient id="waxGold" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#f8dc9a"/><stop offset=".5" stop-color="#e6b15a"/><stop offset="1" stop-color="#b9792f"/>
                        </linearGradient>
                    </defs>
                    <path fill="url(#waxG)" d="M50 3c6 0 8 4 13 5s10-1 13 3 1 9 4 13 8 5 9 10-3 8-2 13 5 9 3 14-7 5-9 10 0 10-4 13-9 0-13 3-6 8-11 9-9-2-14-2-9 4-14 2-4-8-8-11-10-1-12-6 2-9-1-13-8-6-8-11 5-7 5-12-5-9-2-13 9-3 12-7 1-9 5-12 10 0 14-3 6-9 12-9z"/>
                    <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(60,10,0,0.45)" stroke-width="3"/>
                    <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,190,140,0.25)" stroke-width="1" transform="translate(-0.8 -0.8)"/>
                    <text x="50" y="62" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="34" fill="rgba(70,12,0,0.55)">B</text>
                    <text x="49.2" y="61.2" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="34" fill="url(#waxGold)" opacity="0.85">B</text>
                </svg>
            </div>
            <p class="ok caps" id="doneNo">Confirmat ✓</p>
            <h2 id="doneTitle">Ne vedem <span class="o">pe 31!</span></h2>
            <p class="txt" id="doneText"></p>
        </div>

        <div class="foot">
            <button type="button" class="wall-link caps" id="wallBtn">👀 Lista de monștri <b id="wallCount"></b></button>
            <button type="button" class="again caps" id="againBtn" hidden>Alt răspuns</button>
        </div>
    </div>
</main>

<div class="wall" id="wall" aria-hidden="true">
    <div class="wall-box frame" role="dialog" aria-labelledby="wallTitle">
        <i class="c1"></i><i class="c2"></i>
        <div class="wall-head">
            <h2 id="wallTitle">Lista de <span class="o">monștri</span></h2>
            <button type="button" class="close" id="closeWall" aria-label="Închide">×</button>
        </div>
        <div class="totals">
            <div><b id="tFam">0</b><span class="caps">înscrieri</span></div>
            <div><b id="tAd">0</b><span class="caps">adulți</span></div>
            <div><b id="tKid">0</b><span class="caps">copii</span></div>
        </div>
        <div class="tiles" id="tiles"><p class="empty caps">Se încarcă… 🦇</p></div>
    </div>
</div>

<script src="../atmosphere.js"></script>
<script src="../db.js"></script>
<script>
    Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))])
        .then(() => document.body.classList.remove('loading'));

    const $ = id => document.getElementById(id);
    const state = { response: null, adults: 1, kids: 0 };
    const nm = $('name');
    const SAVED_KEY = 'briana-rsvp';
    const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

    document.querySelectorAll('.choice').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.choice').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            state.response = b.dataset.r;
            $('party').classList.toggle('show', state.response === 'yes');
            buzz(12);
            validate();
        });
    });

    document.querySelectorAll('.stepper').forEach(st => {
        const key = st.dataset.key, min = +st.dataset.min, max = +st.dataset.max;
        st.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
            const before = state[key];
            state[key] = Math.min(max, Math.max(min, state[key] + +btn.dataset.step));
            if (state[key] !== before) buzz(8);
            renderCounts();
        }));
    });

    function renderCounts() {
        $('adultsOut').textContent = state.adults;
        $('kidsOut').textContent = state.kids;
        document.querySelectorAll('.stepper').forEach(st => {
            const v = state[st.dataset.key];
            st.querySelector('[data-step="-1"]').disabled = v <= +st.dataset.min;
            st.querySelector('[data-step="1"]').disabled = v >= +st.dataset.max;
        });
        const total = state.adults + state.kids;
        $('sum').innerHTML = `${esc(nm.value.trim() || 'Tu')}: ${partyLabel(state)} → <b>${plural(total, 'persoană', 'persoane')}</b>`;
    }

    $('addMsg').addEventListener('click', () => {
        $('addMsg').classList.add('hide');
        $('msgField').classList.add('show');
        $('msg').focus();
    });

    function validate() { $('sendBtn').disabled = !(nm.value.trim() && state.response); }
    nm.addEventListener('input', () => { validate(); renderCounts(); });

    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = $('sendBtn');
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = 'Se trimite…';
        $('err').classList.remove('show');

        const yes = state.response === 'yes';
        const entry = {
            name: nm.value.trim().slice(0, MAX_NAME),
            response: state.response,
            adults: yes ? state.adults : 0,
            kids: yes ? state.kids : 0,
            message: $('msg').value.trim().slice(0, MAX_MSG),
            time: new Date().toISOString(),
        };

        try {
            guests = await updateGuests(list => list.push(entry), 'RSVP: ' + entry.name);
        } catch (ex) {
            console.error(ex);
            $('err').textContent = 'Nu s-a putut trimite. Mai apasă o dată.';
            $('err').classList.add('show');
            btn.disabled = false;
            btn.innerHTML = 'Trimite <span class="arr">→</span>';
            return;
        }

        try { localStorage.setItem(SAVED_KEY, JSON.stringify(entry)); } catch (ex) {}
        showDone(entry, true);
        renderWall();
    });

    function showDone(entry, celebrate) {
        const yes = entry.response === 'yes';
        $('doneNo').textContent = yes ? 'Confirmat ✓' : 'Am notat';
        $('doneTitle').innerHTML = yes ? 'Ne vedem <span class="o">pe 31!</span>' : 'Păcat… <span class="o">poate altă dată</span>';
        $('doneText').textContent = yes
            ? `Te-am trecut cu ${partyLabel(entry)}. Pregătiți costumele!`
            : 'Îți mulțumim că ne-ai anunțat.';
        $('form').classList.add('off');
        $('done').classList.add('show');
        document.querySelector('.card').classList.add('is-done');
        $('againBtn').hidden = false;
        if (celebrate && yes) buzz([20, 40, 20]);
    }

    $('againBtn').addEventListener('click', () => {
        try { localStorage.removeItem(SAVED_KEY); } catch (ex) {}
        state.response = null; state.adults = 1; state.kids = 0;
        nm.value = ''; $('msg').value = '';
        $('msgField').classList.remove('show'); $('addMsg').classList.remove('hide');
        document.querySelectorAll('.choice').forEach(x => x.classList.remove('on'));
        $('party').classList.remove('show');
        $('sendBtn').innerHTML = 'Trimite <span class="arr">→</span>';
        renderCounts(); validate();
        $('done').classList.remove('show');
        $('form').classList.remove('off');
        document.querySelector('.card').classList.remove('is-done');
        $('againBtn').hidden = true;
    });

    // Lista de monștri
    let guests = null;
    const MONSTERS = ['👻', '🧛', '🧟', '🧙', '🦇', '🕷️', '🎃', '👽', '🧌', '💀', '🐺', '🦉', '🧚', '🐈‍⬛'];
    const monsterFor = name => MONSTERS[[...name].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % MONSTERS.length];

    async function loadWall() {
        try {
            guests = (await loadGuests()).data;
            renderWall();
        } catch (ex) {
            console.error(ex);
            $('tiles').innerHTML = '<p class="empty caps">Lista nu s-a putut încărca 👻</p>';
        }
    }

    function renderWall() {
        if (!guests) return;
        const t = totals(guests);
        $('tFam').textContent = t.families;
        $('tAd').textContent = t.adults;
        $('tKid').textContent = t.kids;
        $('wallCount').textContent = t.adults + t.kids ? `(${t.adults + t.kids})` : '';

        if (!guests.length) {
            $('tiles').innerHTML = '<p class="empty caps">Fii primul monstru de pe listă 🦇</p>';
            return;
        }
        // Ordinea înscrierii (lista se salvează cronologic)
        const ordered = guests
            .map((g, i) => ({ g, i }))
            .sort((a, b) => (a.g.time || '').localeCompare(b.g.time || '') || a.i - b.i);
        $('tiles').innerHTML = ordered.map(({ g }, i) => {
            const yes = g.response === 'yes';
            return `<div class="tile ${yes ? '' : 'no'}">
                <span class="nr"><small>Nº</small>${i + 1}</span>
                <div class="m">${yes ? monsterFor(g.name) : '💤'}</div>
                <div class="n">${esc(g.name)}</div>
                <div class="c caps">${yes ? partyLabel(g) : 'nu poate'}</div>
            </div>`;
        }).join('');
    }

    const wall = $('wall');
    function openWall() { wall.classList.add('show'); wall.setAttribute('aria-hidden', 'false'); loadWall(); }
    function closeWall() { wall.classList.remove('show'); wall.setAttribute('aria-hidden', 'true'); }
    $('wallBtn').addEventListener('click', openWall);
    $('closeWall').addEventListener('click', closeWall);
    wall.addEventListener('click', e => { if (e.target === wall) closeWall(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeWall(); });

    // Pornire
    renderCounts();
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SAVED_KEY)); } catch (ex) {}
    if (saved && saved.name) showDone(saved, false);
    loadWall();
</script>
</body>
</html>
